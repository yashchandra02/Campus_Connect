
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Club Portal | Admin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Login Page -->
    <section id="loginPage" class="login-container">
        <div class="login-card">
            <h1>College Clubs & Events Portal</h1>
            <p>Admin Portal</p>

            <form id="loginForm">
                <label for="username">Username</label>
                <input id="username" type="text"
                       placeholder="Enter username" required>

                <label for="password">Password</label>
                <input id="password" type="password"
                       placeholder="Enter password" required>

                <button type="submit">Login</button>
                <p id="loginMessage" class="message"></p>
            </form>
        </div>
    </section>

    <!-- Admin Dashboard -->
    <section id="dashboardPage" class="hidden">
        <header class="topbar">
            <div>
                <h1>College Clubs & Events Portal</h1>
                <p>Club Admin Dashboard</p>
            </div>
            <button id="logoutBtn" class="logout-btn">Logout</button>
        </header>

        <main class="container">
            <div class="page-heading">
                <div>
                    <h2>Manage Events</h2>
                    <p>Add, update and manage college events.</p>
                </div>
                <button id="addEventBtn">+ Add Event</button>
            </div>

            <!-- Add/Edit Event Form -->
            <section id="eventFormSection" class="form-card hidden">
                <h3 id="formTitle">Add New Event</h3>

                <form id="eventForm">
                    <label for="eventTitle">Event Name</label>
                    <input id="eventTitle" type="text" required>

                    <label for="eventClub">Club Name</label>
                    <select id="eventClub" required>
                        <option value="">Select a club</option>
                        <option>IEEE</option>
                        <option>OSCODE</option>
                        <option>NSS</option>
                        <option>Protocol</option>
                    </select>

                    <label for="eventDate">Date</label>
                    <input id="eventDate" type="date" required>

                    <label for="eventTime">Time</label>
                    <input id="eventTime" type="time" required>

                    <label for="eventVenue">Venue</label>
                    <input id="eventVenue" type="text" required>

                    <label for="eventDescription">Description</label>
                    <textarea id="eventDescription" rows="3"
                              required></textarea>

                    <label for="eventRules">Rules / Instructions</label>
                    <textarea id="eventRules" rows="2"></textarea>

                    <label for="eventLink">Registration Link</label>
                    <input id="eventLink" type="url"
                           placeholder="https://example.com">

                    <div class="form-actions">
                        <button type="submit" id="saveBtn">Save Event</button>
                        <button type="button" id="cancelBtn"
                                class="secondary-btn">Cancel</button>
                    </div>
                </form>
            </section>

            <p id="statusMessage" class="status-message"
               aria-live="polite"></p>

            <!-- Events List -->
            <section>
                <h3>Existing Events</h3>
                <div id="eventsList" class="events-grid"></div>
            </section>
        </main>
    </section>

    <script src="script.js"></script>
</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore college clubs and their upcoming events on CampusConnect.">
    <title>Club Details | CampusConnect</title>

    <link rel="stylesheet" href="IndexStyle/main.css">
    <link rel="stylesheet" href="IndexStyle/header-hero.css">
    <link rel="stylesheet" href="IndexStyle/clubs-events.css">
    <link rel="stylesheet" href="IndexStyle/footer-about.css">
    <link rel="stylesheet" href="IndexStyle/responsive.css">

    <style>
        .club-details-page {
            width: min(1100px, 100%);
            margin: 0 auto;
            padding: 36px 24px 80px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 26px;
            padding: 9px 0;
            color: inherit;
            font-weight: 600;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: #d6b56d;
        }

        .back-link:focus-visible,
        .club-details-button:focus-visible,
        .club-detail-event a:focus-visible {
            outline: 3px solid #d6b56d;
            outline-offset: 4px;
        }

        .club-details-card {
            overflow: hidden;
            border: 1px solid rgba(214, 181, 109, 0.2);
            border-radius: 20px;
            background: #202020;
            color: #f7f3eb;
            box-shadow: 0 14px 36px rgba(0, 0, 0, 0.12);
        }

        .club-details-banner {
            min-height: 220px;
            background: #30302d;
        }

        .club-details-banner img {
            display: block;
            width: 100%;
            height: 320px;
            object-fit: cover;
            object-position: center;
        }

        .club-details-content {
            padding: 36px;
        }

        .club-details-category {
            display: inline-block;
            margin-bottom: 8px;
            color: #d6b56d;
            font-size: 0.8rem;
            font-weight: 800;
            letter-spacing: 1.8px;
            text-transform: uppercase;
        }

        .club-details-content h1 {
            margin: 8px 0 16px;
            font-size: clamp(2rem, 5vw, 3.2rem);
            line-height: 1.15;
            overflow-wrap: anywhere;
        }

        .club-details-description {
            max-width: 720px;
            margin: 0;
            color: #d3d0c9;
            font-size: 1.03rem;
            line-height: 1.85;
        }

        .club-details-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 28px;
        }

        .club-details-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding: 12px 20px;
            border: 1px solid #d6b56d;
            border-radius: 9px;
            background: #d6b56d;
            color: #202020;
            font-weight: 700;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            transition:
    background 0.2s ease,
    color 0.2s ease,
    transform 0.2s ease;
        }

        .club-details-button:hover {
            background: #e5c982;
            transform: translateY(-2px);
        }

        .club-details-button.secondary {
            background: transparent;
            color: #f7f3eb;
        }

        .club-details-button.secondary:hover {
            background: rgba(214, 181, 109, 0.12);
            color: #e5c982;
        }

        .club-events-section {
            margin-top: 52px;
        }

        .club-events-section h2 {
            margin: 0 0 10px;
            font-size: clamp(1.5rem, 3vw, 2rem);
            line-height: 1.3;
        }

        .club-events-section > p {
            margin-bottom: 24px;
            color: #77736b;
            line-height: 1.7;
        }

        #club-events {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
            align-items: stretch;
        }

        .club-detail-event {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            min-width: 0;
            padding: 24px;
            margin: 0;
            border: 1px solid #e5dfd3;
            border-radius: 14px;
            background: #fffdf8;
            color: #242424;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.04);
            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                border-color 0.2s ease;
        }

        .club-detail-event:hover {
            transform: translateY(-3px);
            border-color: #d6b56d;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.08);
        }

        .club-detail-event h3 {
            margin: 0 0 12px;
            font-size: 1.2rem;
            line-height: 1.4;
            overflow-wrap: anywhere;
        }

        .club-detail-event p {
            margin: 0 0 10px;
            color: #625e56;
            line-height: 1.7;
        }

        .club-detail-event a {
            display: inline-block;
            margin-top: auto;
            padding-top: 8px;
            color: #795d24;
            font-weight: 700;
            text-decoration-thickness: 1px;
            text-underline-offset: 4px;
        }

        .club-detail-event a:hover {
            color: #4f3b14;
        }

        .club-details-message {
            padding: 28px;
            border: 1px solid #e5dfd3;
            border-radius: 14px;
            background: #f3efe6;
            color: #242424;
            line-height: 1.8;
        }

        @media (max-width: 700px) {
            .club-details-page {
                padding: 28px 18px 56px;
            }

            .club-details-banner img {
                height: 240px;
            }

            .club-details-content {
                padding: 26px 22px;
            }

            .club-events-section {
                margin-top: 40px;
            }

            #club-events {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 420px) {
            .club-details-page {
                padding-right: 14px;
                padding-left: 14px;
            }

            .club-details-banner img {
                height: 200px;
            }

            .club-details-content {
                padding: 22px 18px;
            }

            .club-details-actions {
                flex-direction: column;
            }

            .club-details-button {
                width: 100%;
            }

            .club-details-message {
                padding: 20px;
            }

            .club-detail-event {
                padding: 20px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .club-details-button,
            .club-detail-event,
            .back-link {
                transition: none;
            }

            .club-details-button:hover,
            .club-detail-event:hover {
                transform: none;
            }
        }
/* Clickable event cards */
.club-detail-event-link {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    min-width: 0;
    height: 100%;
    box-sizing: border-box;
    padding: 24px;
    border: 1px solid #e5dfd3;
    border-radius: 14px;
    background: #fffdf8;
    color: #242424;
    text-decoration: none;
    box-shadow: 0 5px 18px rgba(0, 0, 0, 0.04);
    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        border-color 0.2s ease;
}

.club-detail-event-link:hover {
    transform: translateY(-3px);
    border-color: #d6b56d;
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.08);
}

.club-detail-event-link:focus-visible {
    outline: 3px solid #d6b56d;
    outline-offset: 4px;
}

.club-detail-event-link h3 {
    margin: 0 0 12px;
    color: #242424;
    font-size: 1.2rem;
    line-height: 1.4;
}

.club-detail-event-link p {
    margin: 0 0 10px;
    color: #625e56;
    line-height: 1.7;
}

.club-detail-event-cta {
    margin-top: 8px;
    color: #795d24;
    font-weight: 700;
}

.club-detail-event-link:hover .club-detail-event-cta {
    text-decoration: underline;
    text-underline-offset: 4px;
}

@media (prefers-reduced-motion: reduce) {
    .club-detail-event-link {
        transition: none;
    }

    .club-detail-event-link:hover {
        transform: none;
    }
}
    </style>
</head>

<body>
    <header class="site-header">
        <div class="container header-container">
            <a class="logo" href="index.html">CampusConnect</a>

            <nav aria-label="Main navigation">
                <a href="index.html#home">Home</a>
                <a href="index.html#clubs">Clubs</a>
                <a href="index.html#events">Events</a>
                <a href="index.html#about">About</a>
            </nav>
        </div>
    </header>

    <main class="club-details-page">
        <a class="back-link" href="index.html#clubs">
            ← Back to all clubs
        </a>

        <section id="club-details" aria-live="polite">
            <div class="club-details-message">
                Loading club information...
            </div>
        </section>

        <section class="club-events-section" aria-labelledby="club-events-heading">
            <h2 id="club-events-heading">Events by this club</h2>
            <div id="club-events" aria-live="polite">
                <p>Loading events...</p>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>© 2026 CampusConnect. All rights reserved.</p>
        </div>
    </footer>

    <script src="club-details.js" defer></script>
</body>
</html>

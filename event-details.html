
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
        name="description"
        content="Explore event details on CampusConnect."
    >

    <title>Event Details | CampusConnect</title>

    <link rel="stylesheet" href="IndexStyle/main.css">
    <link rel="stylesheet" href="IndexStyle/header-hero.css">
    <link rel="stylesheet" href="IndexStyle/clubs-events.css">
    <link rel="stylesheet" href="IndexStyle/footer-about.css">
    <link rel="stylesheet" href="IndexStyle/responsive.css">

    <style>
        .event-details-page {
            max-width: 1100px;
            margin: 0 auto;
            padding: 48px 24px 80px;
        }

        .event-details-back {
            display: inline-block;
            margin-bottom: 28px;
            color: inherit;
            text-decoration: none;
        }

        .event-details-card {
            overflow: hidden;
            border-radius: 18px;
            background: #202020;
            color: #f7f3eb;
        }

        .event-details-banner {
            background: #30302d;
        }

        .event-details-banner img {
            display: block;
            width: 100%;
            height: 340px;
            object-fit: cover;
        }

        .event-details-content {
            padding: 32px;
        }

        .event-details-category {
            color: #d6b56d;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .event-details-content h1 {
            margin: 12px 0 20px;
            font-size: clamp(2rem, 5vw, 3.2rem);
        }

        .event-details-description {
            max-width: 760px;
            color: #d3d0c9;
            line-height: 1.8;
        }

        .event-details-meta {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
            margin-top: 28px;
        }

        .event-meta-item {
            padding: 18px;
            border: 1px solid #45433e;
            border-radius: 10px;
        }

        .event-meta-item strong {
            display: block;
            margin-bottom: 8px;
            color: #d6b56d;
        }

        .event-meta-item span {
            line-height: 1.6;
        }

        .event-details-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 28px;
        }

        .event-details-button {
            display: inline-block;
            padding: 12px 20px;
            border: 1px solid #d6b56d;
            border-radius: 8px;
            background: #d6b56d;
            color: #202020;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
        }

        .event-details-button.secondary {
            background: transparent;
            color: #f7f3eb;
        }

        .event-details-message {
            padding: 24px;
            border-radius: 12px;
            background: #f3efe6;
            color: #242424;
            line-height: 1.7;
        }

        .event-details-message a {
            color: #795d24;
            font-weight: 700;
        }

        .event-registration-note {
            margin-top: 18px;
            color: #d3d0c9;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        @media (max-width: 600px) {
            .event-details-page {
                padding: 32px 16px 56px;
            }

            .event-details-banner img {
                height: 220px;
            }

            .event-details-content {
                padding: 22px;
            }

            .event-details-meta {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <header class="site-header">
        <div class="container header-container">
            <a class="logo" href="index.html">CampusConnect</a>

            <nav aria-label="Main navigation">
                <a href="index.html#home">Home</a>
                <a href="index.html#clubs">Clubs</a>
                <a href="index.html#events">Events</a>
                <a href="index.html#about">About</a>
            </nav>
        </div>
    </header>

    <main class="event-details-page">
        <a class="event-details-back" href="index.html#events">
            ← Back to all events
        </a>

        <section id="event-details" aria-live="polite">
            <div class="event-details-message">
                Loading event information...
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>© 2026 CampusConnect. All rights reserved.</p>
        </div>
    </footer>

    <script src="event-details.js" defer></script>
</body>
</html>

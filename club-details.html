
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore college clubs on CampusConnect.">
    <title>Club Details | CampusConnect</title>

    <link rel="stylesheet" href="IndexStyle/main.css">
    <link rel="stylesheet" href="IndexStyle/header-hero.css">
    <link rel="stylesheet" href="IndexStyle/clubs-events.css">
    <link rel="stylesheet" href="IndexStyle/footer-about.css">
    <link rel="stylesheet" href="IndexStyle/responsive.css">

    <style>
        .club-details-page {
            max-width: 1100px;
            margin: 0 auto;
            padding: 48px 24px 80px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 28px;
            color: inherit;
            text-decoration: none;
        }

        .club-details-card {
            overflow: hidden;
            border-radius: 18px;
            background: #202020;
            color: #f7f3eb;
        }

        .club-details-banner {
            min-height: 280px;
            background: #30302d;
        }

        .club-details-banner img {
            width: 100%;
            height: 320px;
            object-fit: cover;
            display: block;
        }

        .club-details-content {
            padding: 32px;
        }

        .club-details-category {
            color: #d6b56d;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1.5px;
        }

        .club-details-content h1 {
            margin: 12px 0;
            font-size: clamp(2rem, 5vw, 3.2rem);
        }

        .club-details-description {
            max-width: 700px;
            line-height: 1.8;
            color: #d3d0c9;
        }

        .club-details-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 28px;
        }

        .club-details-button {
            display: inline-block;
            padding: 12px 20px;
            border: 1px solid #d6b56d;
            border-radius: 8px;
            background: #d6b56d;
            color: #202020;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
        }

        .club-details-button.secondary {
            background: transparent;
            color: #f7f3eb;
        }

        .club-events-section {
            margin-top: 48px;
        }

        .club-events-section h2 {
            margin-bottom: 20px;
        }

        .club-detail-event {
            padding: 20px;
            margin-bottom: 14px;
            border: 1px solid #dedbd3;
            border-radius: 12px;
            background: #fffdf8;
            color: #242424;
        }

        .club-detail-event h3 {
            margin: 0 0 8px;
        }

        .club-detail-event p {
            line-height: 1.6;
        }

        .club-detail-event a {
            color: #795d24;
            font-weight: 700;
        }

        .club-details-message {
            padding: 24px;
            border-radius: 12px;
            background: #f3efe6;
            color: #242424;
            line-height: 1.7;
        }
    </style>
</head>

<body>
    <header class="site-header">
        <div class="container header-container">
            <a class="logo" href="index.html">CampusConnect</a>

            <nav aria-label="Main navigation">
                <a href="index.html#home">Home</a>
                <a href="index.html#clubs">Clubs</a>
                <a href="index.html#events">Events</a>
                <a href="index.html#about">About</a>
            </nav>
        </div>
    </header>

    <main class="club-details-page">
        <a class="back-link" href="index.html#clubs">
            ← Back to all clubs
        </a>

        <section id="club-details" aria-live="polite">
            <div class="club-details-message">
                Loading club information...
            </div>
        </section>

        <section class="club-events-section">
            <h2>Events by this club</h2>
            <div id="club-events">
                <p>Loading events...</p>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>© 2026 CampusConnect. All rights reserved.</p>
        </div>
    </footer>

    <script src="club-details.js" defer></script>
</body>
</html>
